[project]
name = "devops-ai-assistant"
version = "1.0.0"
description = "AI-Powered DevOps Assistant with autonomous infrastructure monitoring and management"
requires-python = ">=3.10"

[tool.black]
line-length = 120
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 120

[tool.bandit]
exclude_dirs = ["tests", "agents/tests", "venv", ".venv"]
skips = ["B101", "B601"]

[tool.pytest.ini_options]
testpaths = ["agents/tests", "tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["backend/src", "agents/src"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_empty = true
