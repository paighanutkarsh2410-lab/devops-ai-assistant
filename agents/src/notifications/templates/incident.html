<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family:sans-serif;max-width:600px;margin:0 auto">
    <div style="background:{{color}};color:white;padding:16px 24px;border-radius:8px 8px 0 0">
        <h2 style="margin:0">[{{severity}}] Incident Detected</h2>
    </div>
    <div style="border:1px solid #e5e7eb;border-top:none;padding:24px;border-radius:0 0 8px 8px">
        <h3 style="margin-top:0">{{title}}</h3>
        <table style="width:100%">
            <tr><td style="color:#6b7280">Service:</td><td><strong>{{service}}</strong></td></tr>
            <tr><td style="color:#6b7280">Detected:</td><td>{{detected}}</td></tr>
            <tr><td style="color:#6b7280">Severity:</td><td style="color:{{color}}"><strong>{{severity}}</strong></td></tr>
        </table>
        <p style="margin-top:16px">{{description}}</p>
        <div style="margin-top:24px">
            <a href="{{dashboard_url}}" style="background:{{color}};color:white;padding:10px 20px;text-decoration:none;border-radius:6px;display:inline-block">View in Dashboard</a>
        </div>
    </div>
    <p style="color:#9ca3af;font-size:12px;text-align:center;margin-top:16px">DevOps AI Assistant</p>
</body>
</html>
