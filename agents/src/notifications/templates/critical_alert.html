<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family:sans-serif;max-width:600px;margin:0 auto">
    <div style="background:#dc2626;color:white;padding:20px 24px;border-radius:8px">
        <h2 style="margin:0">URGENT: {{title}}</h2>
        <p style="margin:8px 0 0;font-size:16px">Service <strong>{{service}}</strong> — {{severity}}</p>
        <p style="margin:8px 0 0;opacity:0.9">{{description}}</p>
        <p style="margin:12px 0 0;font-size:13px;opacity:0.8">Detected: {{detected}}</p>
        <div style="margin-top:16px">
            <a href="{{dashboard_url}}" style="background:white;color:#dc2626;padding:10px 20px;text-decoration:none;border-radius:6px;display:inline-block;font-weight:bold">View Incident</a>
        </div>
    </div>
</body>
</html>
