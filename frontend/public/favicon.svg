<svg width="500" height="500" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="nn-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="nn-bloom" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <radialGradient id="nn-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7"></stop>
      <stop offset="60%" stop-color="#6366F1"></stop>
      <stop offset="100%" stop-color="#1E3A8A"></stop>
    </radialGradient>
    <linearGradient id="nn-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"></stop>
      <stop offset="100%" stop-color="#60A5FA"></stop>
    </linearGradient>
    <linearGradient id="nn-outer-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.7"></stop>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.7"></stop>
    </linearGradient>
  </defs>

  
  <circle cx="150" cy="150" r="118" fill="none" stroke="#4338CA" stroke-width="0.8" opacity="0.5"></circle>
  <circle cx="150" cy="150" r="108" fill="none" stroke="#6366F1" stroke-width="0.5" opacity="0.3" stroke-dasharray="4 8"></circle>

  
  <line x1="150" y1="72" x2="210" y2="110" stroke="url(#nn-outer-edge)" stroke-width="1.2" opacity="0.55"></line>
  <line x1="210" y1="110" x2="210" y2="190" stroke="url(#nn-outer-edge)" stroke-width="1.2" opacity="0.55"></line>
  <line x1="210" y1="190" x2="150" y2="228" stroke="url(#nn-outer-edge)" stroke-width="1.2" opacity="0.55"></line>
  <line x1="150" y1="228" x2="90" y2="190" stroke="url(#nn-outer-edge)" stroke-width="1.2" opacity="0.55"></line>
  <line x1="90" y1="190" x2="90" y2="110" stroke="url(#nn-outer-edge)" stroke-width="1.2" opacity="0.55"></line>
  <line x1="90" y1="110" x2="150" y2="72" stroke="url(#nn-outer-edge)" stroke-width="1.2" opacity="0.55"></line>

  
  <line x1="150" y1="72" x2="150" y2="112" stroke="url(#nn-outer-edge)" stroke-width="1.2" opacity="0.55"></line>
  <line x1="210" y1="110" x2="185" y2="131" stroke="url(#nn-outer-edge)" stroke-width="1.2" opacity="0.55"></line>
  <line x1="210" y1="190" x2="185" y2="169" stroke="url(#nn-outer-edge)" stroke-width="1.2" opacity="0.55"></line>
  <line x1="150" y1="228" x2="150" y2="188" stroke="url(#nn-outer-edge)" stroke-width="1.2" opacity="0.55"></line>
  <line x1="90" y1="190" x2="115" y2="169" stroke="url(#nn-outer-edge)" stroke-width="1.2" opacity="0.55"></line>
  <line x1="90" y1="110" x2="115" y2="131" stroke="url(#nn-outer-edge)" stroke-width="1.2" opacity="0.55"></line>

  
  <polygon points="150,112 185,131 185,169 150,188 115,169 115,131" fill="url(#nn-center)" opacity="0.92"></polygon>

  
  <line x1="150" y1="112" x2="185" y2="131" stroke="url(#nn-edge)" stroke-width="1.8" filter="url(#nn-glow)"></line>
  <line x1="185" y1="131" x2="185" y2="169" stroke="url(#nn-edge)" stroke-width="1.8" filter="url(#nn-glow)"></line>
  <line x1="185" y1="169" x2="150" y2="188" stroke="url(#nn-edge)" stroke-width="1.8" filter="url(#nn-glow)"></line>
  <line x1="150" y1="188" x2="115" y2="169" stroke="url(#nn-edge)" stroke-width="1.8" filter="url(#nn-glow)"></line>
  <line x1="115" y1="169" x2="115" y2="131" stroke="url(#nn-edge)" stroke-width="1.8" filter="url(#nn-glow)"></line>
  <line x1="115" y1="131" x2="150" y2="112" stroke="url(#nn-edge)" stroke-width="1.8" filter="url(#nn-glow)"></line>
  <line x1="150" y1="112" x2="150" y2="188" stroke="url(#nn-edge)" stroke-width="1.2" filter="url(#nn-glow)" opacity="0.6"></line>
  <line x1="185" y1="131" x2="115" y2="169" stroke="url(#nn-edge)" stroke-width="1.2" filter="url(#nn-glow)" opacity="0.6"></line>
  <line x1="185" y1="169" x2="115" y2="131" stroke="url(#nn-edge)" stroke-width="1.2" filter="url(#nn-glow)" opacity="0.6"></line>

  
  <circle cx="150" cy="72" r="7" fill="#1a0a3a" stroke="#818CF8" stroke-width="1.4"></circle>
  <circle cx="210" cy="110" r="7" fill="#1a0a3a" stroke="#818CF8" stroke-width="1.4"></circle>
  <circle cx="210" cy="190" r="7" fill="#1a0a3a" stroke="#818CF8" stroke-width="1.4"></circle>
  <circle cx="150" cy="228" r="7" fill="#1a0a3a" stroke="#818CF8" stroke-width="1.4"></circle>
  <circle cx="90" cy="190" r="7" fill="#1a0a3a" stroke="#818CF8" stroke-width="1.4"></circle>
  <circle cx="90" cy="110" r="7" fill="#1a0a3a" stroke="#818CF8" stroke-width="1.4"></circle>

  <circle cx="150" cy="72" r="3.5" fill="#C084FC" filter="url(#nn-glow)"></circle>
  <circle cx="210" cy="110" r="3.5" fill="#C084FC" filter="url(#nn-glow)"></circle>
  <circle cx="210" cy="190" r="3.5" fill="#C084FC" filter="url(#nn-glow)"></circle>
  <circle cx="150" cy="228" r="3.5" fill="#C084FC" filter="url(#nn-glow)"></circle>
  <circle cx="90" cy="190" r="3.5" fill="#C084FC" filter="url(#nn-glow)"></circle>
  <circle cx="90" cy="110" r="3.5" fill="#C084FC" filter="url(#nn-glow)"></circle>

  
  <circle cx="150" cy="112" r="5" fill="#E879F9" filter="url(#nn-glow)"></circle>
  <circle cx="185" cy="131" r="5" fill="#E879F9" filter="url(#nn-glow)"></circle>
  <circle cx="185" cy="169" r="5" fill="#E879F9" filter="url(#nn-glow)"></circle>
  <circle cx="150" cy="188" r="5" fill="#E879F9" filter="url(#nn-glow)"></circle>
  <circle cx="115" cy="169" r="5" fill="#E879F9" filter="url(#nn-glow)"></circle>
  <circle cx="115" cy="131" r="5" fill="#E879F9" filter="url(#nn-glow)"></circle>

  
  <polygon points="150,134 166,150 150,166 134,150" fill="white" opacity="0.95" filter="url(#nn-bloom)"></polygon>
  <polygon points="150,138 162,150 150,162 138,150" fill="#E879F9"></polygon>
  <polygon points="150,143 157,150 150,157 143,150" fill="white" filter="url(#nn-glow)"></polygon>

  
  <ellipse cx="150" cy="150" rx="52" ry="18" fill="none" stroke="#818CF8" stroke-width="1.2" opacity="0.4" transform="rotate(-30 150 150)" stroke-dasharray="3 5"></ellipse>
  <ellipse cx="150" cy="150" rx="52" ry="18" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.4" transform="rotate(30 150 150)" stroke-dasharray="3 5"></ellipse>
</svg>